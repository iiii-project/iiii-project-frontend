# 生產環境用（單台 Azure VM），只含前端 nginx 與 caddy。
# 後端在 iiii-project-backend/compose.prod.yaml 另外啟動，兩邊透過共用的
# docker network「iiii-project」互通（nginx 以 backend:8000 連到後端）。
#
# 跟 compose.yaml（本機開發用）的差異：
#   - frontend 不直接對外開埠，前面多一層 caddy 做 TLS 終止 + 自動憑證更新
#   - restart 政策改成 always（VM 重開機也要自動長回來）
#
# 用法（第一次要先建立共用網路）：
#   docker network create iiii-project
#   cd iiii-project-frontend
#   docker compose -f compose.prod.yaml up -d --build
services:
  frontend:
    build: .
    restart: always
    environment:
      BACKEND_URL: http://backend:8000
      NGINX_ENVSUBST_FILTER: BACKEND_URL
    networks:
      - default
      - iiii-project

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

networks:
  iiii-project:
    name: iiii-project
    external: true

volumes:
  caddy_data:
  caddy_config:
