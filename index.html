<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <!-- 目標裝置 Warpple JJ5（27 吋 Full HD，直立擺放 = 1080×1920）：版面寬度固定 1080px，
         不受裝置回報的 devicePixelRatio 影響，也不會落入 @media (max-width: 640px) 的窄版樣式。
         桌機瀏覽器會忽略這行。 -->
    <meta name="viewport" content="width=1080, initial-scale=1" />
    <meta name="theme-color" content="#7a2626" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="籤好運" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>AI 求籤互動系統</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
