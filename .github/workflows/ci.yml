# CI：每次 push 到 main 或開 PR 時，自動安裝套件並建置（含 vue-tsc 型別檢查）。
# 建置失敗會在 commit / PR 上顯示紅色叉叉，避免壞掉的程式碼上線。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR 連續 push 時取消還在跑的舊任務，只檢查最新的 commit。
# main 不取消：那裡的執行可能正在部署，砍到一半會留下半套容器。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # 與 Dockerfile 的 node:22-alpine 一致
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build

  # CD：build 通過、而且是 push 到 main 才部署（PR 不部署）。
  # 在 VM 上執行本 repo 的 scripts/deploy.sh（只更新、重建前端自己的容器）。
  # 在 repo 的 Settings → Secrets and variables → Actions 設定：
  #   Secrets：VM_HOST、VM_USER、VM_SSH_KEY（私鑰）、VM_PORT（選填，預設 22）
  #   Variables：DEPLOY_ENABLED=true（設好 secrets 後再打開）、
  #              DEPLOY_ROOT（選填，VM 上放兩個 repo 的資料夾，預設 $HOME/iiii-project）
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    # 同一個 repo 連續 push 時排隊，不取消進行中的部署（中途砍掉可能留下半套容器）
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          command_timeout: 30m
          script: |
            ROOT="${{ vars.DEPLOY_ROOT }}"
            ROOT="${ROOT:-$HOME/iiii-project}"
            bash "$ROOT/iiii-project-frontend/scripts/deploy.sh"
